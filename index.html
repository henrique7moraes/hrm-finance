<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HRM Finance</title>
  <meta name="theme-color" content="#F4F6FA">
  <script>try{var t=JSON.parse(localStorage.getItem('hrm_tema'));document.documentElement.dataset.tema=t==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HRM Finance">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="tela"></main>

    <nav class="nav" id="nav" hidden>
      <div class="marca"><img src="icon-192.png" alt=""><b>HRM Finance</b></div>
      <button data-view="painel" class="ativo" aria-label="Início">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h5v-6h4v6h5V9"/></svg><span class="rot">Início</span>
      </button>
      <button data-view="fluxo" aria-label="Fluxo de caixa">
        <svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg><span class="rot">Fluxo de caixa</span>
      </button>
      <button data-view="lancar" class="fab" aria-label="Lançar entrada ou saída">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span class="rot">Novo lançamento</span>
      </button>
      <button data-view="analise" aria-label="Análise">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/></svg><span class="rot">Análise</span>
      </button>
      <button data-view="orcamento" aria-label="Orçamentos">
        <svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3"/><path d="M21 12A9 9 0 0 0 12 3v9z"/></svg><span class="rot">Orçamentos</span>
      </button>
      <div class="so-web">
        <span class="nav-secao">Atalhos</span>
        <button data-view="compromissos" aria-label="Compromissos">
          <svg viewBox="0 0 24 24"><path d="M21 7.5V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h3.5"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h5"/><path d="M17.5 17.5 16 16.3V14"/><circle cx="16" cy="16" r="6"/></svg><span class="rot">Compromissos</span>
        </button>
        <button data-view="economias" aria-label="Cofrinhos">
          <svg viewBox="0 0 24 24"><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/></svg><span class="rot">Cofrinhos</span>
        </button>
        <button data-view="dizimos" aria-label="Fidelidade">
          <svg viewBox="0 0 24 24"><path d="M10 9h4"/><path d="M12 7v5"/><path d="M14 22v-4a2 2 0 0 0-4 0v4"/><path d="M18 22V5.6a1 1 0 0 0-.55-.9l-4.56-2.27a2 2 0 0 0-1.78 0L6.55 4.7a1 1 0 0 0-.55.9V22"/><path d="m18 9 3.45 1.72a1 1 0 0 1 .55.9V20a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8.38a1 1 0 0 1 .55-.9L6 9"/></svg><span class="rot">Fidelidade</span>
        </button>
        <button data-view="receber" aria-label="A receber">
          <svg viewBox="0 0 24 24"><path d="M11 15h2a2 2 0 1 0 0-4h-3c-.6 0-1.1.2-1.4.6L3 17"/><path d="m7 21 1.6-1.4c.3-.4.8-.6 1.4-.6h4c1.1 0 2.1-.4 2.8-1.2l4.6-4.4a2 2 0 0 0-2.75-2.91l-4.2 3.9"/><path d="m2 16 6 6"/><circle cx="16" cy="9" r="2.9"/><circle cx="6" cy="5" r="3"/></svg><span class="rot">A receber</span>
        </button>
      </div>
    </nav>

    <div class="folha-fundo" id="folhaFundo" hidden></div>
    <section class="folha" id="folha" hidden></section>
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  </div>
  <div id="relatorio"></div>
  <script src="app.js"></script>
</body>
</html>
