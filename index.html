<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>HRM Finance</title>
  <meta name="theme-color" content="#F4F6FA">
  <script>try{var t=JSON.parse(localStorage.getItem('hrm_tema'));document.documentElement.dataset.tema=t==='escuro'?'escuro':'claro'}catch(e){document.documentElement.dataset.tema='claro'}</script>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="HRM Finance">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <main id="tela"></main>

    <nav class="nav" id="nav" hidden>
      <button data-view="painel" class="ativo" aria-label="Início">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h5v-6h4v6h5V9"/></svg>
      </button>
      <button data-view="fluxo" aria-label="Fluxo de caixa">
        <svg viewBox="0 0 24 24"><path d="M7 4 3 8l4 4"/><path d="M3 8h14"/><path d="m17 20 4-4-4-4"/><path d="M21 16H7"/></svg>
      </button>
      <button data-view="lancar" class="fab" aria-label="Lançar entrada ou saída">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <button data-view="analise" aria-label="Análise">
        <svg viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/></svg>
      </button>
      <button data-view="orcamento" aria-label="Orçamentos">
        <svg viewBox="0 0 24 24"><path d="M21 12A9 9 0 1 1 12 3"/><path d="M21 12A9 9 0 0 0 12 3v9z"/></svg>
      </button>
    </nav>

    <div class="folha-fundo" id="folhaFundo" hidden></div>
    <section class="folha" id="folha" hidden></section>
    <div class="aviso" id="aviso" role="status" aria-live="polite"></div>
  </div>
  <div id="relatorio"></div>
  <script src="app.js"></script>
</body>
</html>
